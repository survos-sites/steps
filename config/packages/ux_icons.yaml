# Full configuration reference: https://symfony.com/bundles/ux-icons/current/index.html#configuration
ux_icons:
    aliases:
        show: bx:show
        code: tabler:api
        external: tabler:external-link
        search: tabler:search
        inst: material-symbols:museum-outline
        obj: material-symbols:wall-art-outline-rounded
        facebook: tabler:brand-facebook
        'layout-grid': tabler:list

    default_icon_attributes:
        fill: red
        width: 16px
        height: 16px

    iconify:
        enabled: true
        on_demand: false
        endpoint: 'https://api.iconify.design'

    ignore_not_found: true

when@dev:
    ux_icons:
        iconify:
            # Persist each on-demand icon to disk on first render, so you don't forget to commit it before deploying (like `ux:icons:lock`)
            auto_lock: true
